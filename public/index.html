<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>大学生辩论赛 · 辩题征集投票</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f9; color: #222; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  header { background: linear-gradient(135deg, #2b5cff, #7b2ff7); color: #fff; padding: 28px 20px 22px; border-radius: 0 0 20px 20px; margin: 0 -16px 18px; }
  header h1 { margin: 0 0 6px; font-size: 21px; }
  header p { margin: 0; font-size: 13px; opacity: .92; line-height: 1.6; }
  .card { background: #fff; border-radius: 14px; padding: 18px 16px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; color: #666; margin: 10px 0 6px; }
  input, textarea { width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 11px 12px; font-size: 15px; outline: none; }
  input:focus, textarea:focus { border-color: #2b5cff; }
  textarea { resize: none; height: 74px; }
  .btn { display: block; width: 100%; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #2b5cff, #7b2ff7); cursor: pointer; margin-top: 14px; }
  .btn:active { opacity: .85; }
  .btn.ghost { background: #eef1ff; color: #2b5cff; }
  .hint { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.6; }
  .topic { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f0f0f0; }
  .topic:last-child { border-bottom: none; }
  .rank { flex: 0 0 30px; height: 30px; border-radius: 50%; background: #eef1ff; color: #2b5cff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .rank.top { background: linear-gradient(135deg, #ff9a3c, #ff5e62); color: #fff; }
  .info { flex: 1; min-width: 0; }
  .info .t { font-size: 15px; font-weight: 600; line-height: 1.45; }
  .info .meta { font-size: 12px; color: #999; margin-top: 4px; }
  .vote-btn { flex: 0 0 auto; border: 1px solid #2b5cff; color: #2b5cff; background: #fff; border-radius: 20px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  .vote-btn.voted { background: #2b5cff; color: #fff; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 26px 0; }
  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 20px; display: none; z-index: 99; max-width: 90%; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>大学生辩论赛 · 辩题征集</h1>
    <p>提交一个你想看的辩题，也可以为喜欢的辩题投票。<br>投稿经审核通过后上榜，每人每个辩题限投 1 票。</p>
  </header>

  <div class="card">
    <h2>提交辩题</h2>
    <label>辩题（必填）</label>
    <textarea id="title" placeholder="例如：大学生是否应该强制晚自习"></textarea>
    <label>你的姓名（必填）</label>
    <input id="name" placeholder="例如：张三" maxlength="20">
    <button class="btn" id="submitBtn">提交辩题</button>
    <div class="hint">提交后需主办方审核，审核通过后才会出现在下方榜单中。</div>
  </div>

  <div class="card">
    <h2>辩题榜单</h2>
    <div id="list"><div class="empty">加载中…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200);
}
async function loadList() {
  try {
    const r = await fetch('/api/topics');
    const d = await r.json();
    const box = $('list');
    if (!d.topics.length) { box.innerHTML = '<div class="empty">暂无辩题，快来提交第一个吧！</div>'; return; }
    box.innerHTML = '';
    d.topics.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'topic';
      const rank = document.createElement('div');
      rank.className = 'rank' + (i < 3 ? ' top' : '');
      rank.textContent = i + 1;
      const info = document.createElement('div');
      info.className = 'info';
      const tt = document.createElement('div'); tt.className = 't'; tt.textContent = t.title;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = `投稿人：${t.name} · ${t.votes} 票`;
      info.appendChild(tt); info.appendChild(meta);
      const btn = document.createElement('button');
      btn.className = 'vote-btn' + (t.voted ? ' voted' : '');
      btn.textContent = t.voted ? '已投票' : '投票';
      btn.onclick = async () => {
        const method = t.voted ? 'DELETE' : 'POST';
        const rr = await fetch(`/api/topics/${t.id}/vote`, { method });
        const dd = await rr.json();
        if (!rr.ok) { toast(dd.error || '操作失败'); return; }
        loadList();
      };
      div.appendChild(rank); div.appendChild(info); div.appendChild(btn);
      box.appendChild(div);
    });
  } catch (e) { $('list').innerHTML = '<div class="empty">加载失败，请刷新重试</div>'; }
}
$('submitBtn').onclick = async () => {
  const title = $('title').value.trim(), name = $('name').value.trim();
  if (title.length < 4) { toast('辩题至少4个字'); return; }
  if (!name) { toast('请填写姓名'); return; }
  const r = await fetch('/api/topics', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, name })
  });
  const d = await r.json();
  if (!r.ok) { toast(d.error || '提交失败'); return; }
  $('title').value = ''; $('name').value = '';
  toast(d.message || '提交成功，待审核');
};
loadList();
setInterval(loadList, 15000);
</script>
</body>
</html>
